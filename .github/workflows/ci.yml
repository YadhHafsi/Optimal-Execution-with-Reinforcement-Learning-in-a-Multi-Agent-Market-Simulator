name: CI

on:
  push:
  pull_request:

env:
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  test:
    name: Tests and smoke training (Python 3.10, ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies and the three ABIDES packages
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch wheel (the default index would pull the CUDA build)
          pip install torch==1.13.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -e ./abides-core -e ./abides-markets -e ./abides-gym

      - name: Run the test-suite
        run: python -m pytest tests -q

      - name: Smoke training (DQN, 1500 environment steps on the smoke configuration)
        run: |
          python -m experiments.train_dqn --config experiments/configs/smoke.yaml \
            --lr 1e-3 --seed 10 --total-timesteps 1500 --out /tmp/smoke
          test -f /tmp/smoke/progress.csv
          test -d /tmp/smoke/checkpoint
