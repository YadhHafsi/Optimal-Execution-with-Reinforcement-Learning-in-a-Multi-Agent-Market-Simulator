# Stage 3a: early-stopping sweep. Evaluation only: the intermediate checkpoints (every 50k steps)
# of the stage-2 coarse-decision runs and of the stage-1 10 s run, on the same 200 seeds,
# against TWAP at the same granularity and the paper's 1 s TWAP (results/reference_1s).
name: stage3a_checkpoints
config: experiments/configs/paper.yaml
eval_seeds: 200
eval_seed_offset: 1000
reference_episodes: results/reference_1s/standard/episodes.csv
scenarios: [standard]
parallel: 4
runs:
- name: c10_q40_s10_at_50k
  checkpoint: results/search_stage2/training/c10_q40_s10/checkpoints/checkpoint_000050
  total_timesteps: 50000
  seed: 10
  env_override: &id001 {timestep_duration: 10s, q_min: 40, num_action_levels: 4, beta_not_enough: 100,
    beta_too_much: 100}
- name: c10_q40_s10_at_100k
  checkpoint: results/search_stage2/training/c10_q40_s10/checkpoints/checkpoint_000100
  total_timesteps: 100000
  seed: 10
  env_override: *id001
- name: c10_q40_s10_at_150k
